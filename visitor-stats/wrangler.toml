# Cloudflare Worker behind the homepage's "🌍 Visitor Map". See README.md for setup and deployment.
name = "visitor-stats"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true # https://visitor-stats.hongshuchen.workers.dev, the page's fallback address
# The page's main address. Unlike *.workers.dev it can be reached from mainland China.
routes = [{ pattern = "stats.hongshuchen.top", custom_domain = true }]

[vars]
# Pages allowed to record visits and read the statistics.
ALLOWED_ORIGINS = "https://hongshuchen.top,https://www.hongshuchen.top"

[[d1_databases]]
binding = "DB"
database_name = "visitor-stats"
database_id = "3429b5fb-edf8-4544-9e31-afeaf38566a7"

[observability]
enabled = true
