# Topic filter buttons above "Selected Publications" on the homepage.
# The first button, "Featured", is always there; add one entry per research topic.
filters:
  - id: topic-a
    label: "[Topic A]"
  - id: topic-b
    label: "[Topic B]"
  - id: topic-c
    label: "[Topic C]"

# Set selected={true} in _bibliography/papers.bib for every paper that should appear on the homepage,
# then list it here by its BibTeX key. `tags` decides which filter buttons show it; add
# `show_in_all: false` when it should appear only after choosing one of its topics, not under "Featured".
papers:
  placeholder-preprint:
    tags: [topic-a]
  placeholder-conference:
    tags: [topic-a, topic-b]
  placeholder-journal:
    tags: [topic-b]
  placeholder-workshop:
    tags: [topic-c]
    show_in_all: false
